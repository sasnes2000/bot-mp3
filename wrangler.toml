name = "bot-mp3"
main = "index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Адрес твоего cobalt (например Railway/Render). Пусто — используем прямой YouTube API.
COBALT_API = ""

# Секреты (задаются командой или в Cloudflare → Settings → Variables):
#   BOT_TOKEN       — токен бота от @BotFather
#   WEBHOOK_SECRET  — пароль вебхука
#   YT_COOKIE       — cookie с youtube.com (обход LOGIN_REQUIRED)
#   COBALT_API      — свой cobalt (если используешь)
#   COBALT_KEY      — ключ cobalt (если требуется)
